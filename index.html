<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Find bræt- og selskabsspil i Spilcaféen.">
    <title>Find et spil · Spilcaféen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <header class="topbar" aria-label="Spilcaféen">
            <a class="logo" href="index.html" aria-label="Spilcaféens forside">▦</a>
        </header>
        <main>
            <section class="search-band" aria-labelledby="page-title">
                <h1 id="page-title" class="sr-only">Find et spil</h1>
                <label class="search-box">
                    <span class="sr-only">Søg efter spil</span>
                    <input type="search" id="search-input" placeholder="SØG EFTER SPIL" autocomplete="off">
                    <span aria-hidden="true">⌕</span>
                </label>
                <button id="search-button" class="search-button" type="button">Søg</button>
                <button id="filter-toggle" class="filter-button" type="button" aria-expanded="false" aria-controls="filter-panel" aria-label="Åbn filter">☷</button>
            </section>
            <label class="sort-control">Sortér
                <select id="sort-select">
                    <option value="standard">Udvalgt rækkefølge</option>
                    <option value="title-asc">Navn: A–Å</option>
                    <option value="time-asc">Korteste spilletid</option>
                    <option value="time-desc">Længste spilletid</option>
                </select>
            </label>
            <aside id="filter-panel" class="filter-panel" aria-hidden="true">
                <div class="filter-header">
                    <h2>Filter</h2>
                    <button id="close-filter" type="button" aria-label="Luk filter">×</button>
                </div>
                <fieldset>
                    <legend>Antal spillere</legend>
                    <div class="player-filters">
                        <label><input type="checkbox" name="players" value="2"><span>2</span></label>
                        <label><input type="checkbox" name="players" value="4"><span>4</span></label>
                        <label><input type="checkbox" name="players" value="5"><span>5+</span></label>
                    </div>
                </fieldset>
                <fieldset>
                    <legend>Kategori</legend>
                    <div id="category-filters" class="category-filters"></div>
                </fieldset>
                <fieldset>
                    <legend>Spilletid: højst <output id="time-output">120</output> min.</legend>
                    <input id="time-range" type="range" min="15" max="120" step="15" value="120">
                </fieldset>
                <fieldset>
                    <legend>Sværhedsgrad</legend>
                    <div class="difficulty-filters">
                        <label><input type="radio" name="difficulty" value=""><span>Alle</span></label>
                        <label><input type="radio" name="difficulty" value="Let"><span>Let</span></label>
                        <label><input type="radio" name="difficulty" value="Middel"><span>Middel</span></label>
                    </div>
                </fieldset>
                <div class="filter-actions">
                    <button id="reset-filters" type="button">Nulstil</button>
                    <button id="apply-filters" type="button">Gem</button>
                </div>
            </aside>
            <section id="products-container" class="games-grid" aria-live="polite"></section>
        </main>
        <nav class="bottom-nav" aria-label="Primær navigation">
            <a href="index.html" aria-label="Hjem">⌂</a>
            <a class="active" href="index.html" aria-current="page" aria-label="Søg">⌕</a>
            <a href="#" aria-label="Reservationer">♢</a>
            <a href="#" aria-label="Profil">◎</a>
        </nav>
    </div>
    <div id="overlay" class="overlay"></div>
    <script src="data.js"></script>
    <script src="scriptui.js"></script>
    <script src="scriptfilt.js"></script>
</body>
</html>
